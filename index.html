<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmetteur · Discord</title>
    <style>
        /* --- RESET & FOND --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0b0e;
            background-image: radial-gradient(circle at 20% 20%, #1a103d 0%, #0b0b0e 80%);
            padding: 20px;
        }

        /* --- CARTE PRINCIPALE (effet verre + néon) --- */
        .glass-card {
            width: 100%;
            max-width: 480px;
            background: rgba(18, 16, 33, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 40px 32px;
            border: 1px solid rgba(108, 99, 255, 0.25);
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.8), 0 0 40px rgba(108, 99, 255, 0.15);
            transition: box-shadow 0.3s ease;
        }

        .glass-card:hover {
            box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.9), 0 0 60px rgba(108, 99, 255, 0.25);
        }

        /* --- EN-TÊTE --- */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .header-icon {
            font-size: 28px;
            background: linear-gradient(135deg, #6c63ff, #b388ff);
            padding: 10px;
            border-radius: 16px;
            line-height: 1;
            box-shadow: 0 0 20px rgba(108, 99, 255, 0.4);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 30%, #b388ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header .badge {
            font-size: 11px;
            background: rgba(108, 99, 255, 0.2);
            color: #b388ff;
            padding: 4px 12px;
            border-radius: 100px;
            border: 1px solid rgba(108, 99, 255, 0.2);
            -webkit-text-fill-color: #b388ff;
            font-weight: 600;
            margin-left: auto;
            letter-spacing: 0.5px;
        }

        /* --- ZONE DE TEXTE --- */
        .input-area {
            margin-bottom: 24px;
        }

        .input-area label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #a7a1d4;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .input-area textarea {
            width: 100%;
            height: 160px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(108, 99, 255, 0.2);
            border-radius: 16px;
            padding: 18px;
            color: #f0edff;
            font-size: 15px;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .input-area textarea:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.15), inset 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .input-area textarea::placeholder {
            color: #5a5580;
            font-weight: 400;
        }

        /* --- COMPTEUR DE CARACTÈRES --- */
        .char-counter {
            text-align: right;
            font-size: 12px;
            color: #5a5580;
            margin-top: 6px;
            padding-right: 6px;
            font-weight: 500;
        }

        /* --- BOUTON D'ENVOI --- */
        .btn-send {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #4a3fcf, #7f5af0);
            border: none;
            border-radius: 60px;
            color: white;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 25px -5px rgba(108, 99, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-send:hover:not(:disabled) {
            transform: scale(1.02);
            background: linear-gradient(135deg, #5a4fe0, #8c6cf5);
            box-shadow: 0 12px 35px -5px rgba(108, 99, 255, 0.6);
        }

        .btn-send:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.5);
            transform: scale(0.98);
        }

        .btn-send .arrow {
            transition: transform 0.2s ease;
        }

        .btn-send:hover:not(:disabled) .arrow {
            transform: translateX(4px);
        }

        /* --- STATUT (messages de retour) --- */
        .status-box {
            margin-top: 18px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            background: rgba(0, 0, 0, 0.25);
            border-left: 3px solid #6c63ff;
            color: #bdb8e6;
            transition: all 0.3s ease;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-box.success {
            border-left-color: #00d4aa;
            color: #9effe6;
            background: rgba(0, 212, 170, 0.08);
        }

        .status-box.error {
            border-left-color: #ff6b6b;
            color: #ffb3b3;
            background: rgba(255, 107, 107, 0.08);
        }

        /* --- PIED DE PAGE --- */
        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 11px;
            color: #3d3a5c;
            letter-spacing: 0.3px;
            border-top: 1px solid rgba(108, 99, 255, 0.08);
            padding-top: 18px;
        }

        .footer-note span {
            color: #6c63ff;
        }

        /* --- ANIMATION --- */
        @keyframes glowPulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        .glow-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #6c63ff;
            border-radius: 50%;
            margin-right: 8px;
            animation: glowPulse 1.8s infinite ease-in-out;
        }
    </style>
</head>
<body>

<div class="glass-card">
    <!-- En-tête -->
    <div class="header">
        <div class="header-icon">⚡</div>
        <h1>Transmetteur</h1>
        <span class="badge">DISCORD</span>
    </div>

    <!-- Zone de saisie -->
    <div class="input-area">
        <label for="messageInput">✏️ Message à envoyer</label>
        <textarea id="messageInput" placeholder="Tape ton texte ici... (lettres, chiffres, tout passe)"></textarea>
        <div class="char-counter"><span id="charCount">0</span> caractères</div>
    </div>

    <!-- Bouton -->
    <button class="btn-send" id="sendBtn" onclick="sendToDiscord()">
        <span>Envoyer</span>
        <span class="arrow">➜</span>
    </button>

    <!-- Statut -->
    <div class="status-box" id="status">
        <span class="glow-dot"></span> Prêt à transmettre
    </div>

    <!-- Footer -->
    <div class="footer-note">
        ⚡ <span>•</span> Connexion sécurisée
    </div>
</div>

<script>
    // 🔴 METS LE LIEN DE TON WEBHOOK DISCORD ICI (ENTRE LES GUILLEMETS) 🔴
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1487866445021970582/i_hBSN1KIINrYl2EiAdFqx9E_0Yzbw_y5JL1jRssV6VxTIFx-0Us6AxZsi06OFkNcbpE";

    // Éléments du DOM
    const input = document.getElementById('messageInput');
    const statusDiv = document.getElementById('status');
    const sendBtn = document.getElementById('sendBtn');
    const charCount = document.getElementById('charCount');

    // Compteur de caractères en temps réel
    input.addEventListener('input', () => {
        charCount.textContent = input.value.length;
    });

    // Fonction principale d'envoi
    async function sendToDiscord() {
        const message = input.value.trim();

        // Vérification si vide
        if (!message) {
            statusDiv.className = 'status-box error';
            statusDiv.innerHTML = '⚠️ Le message est vide, écris quelque chose !';
            return;
        }

        // Désactiver le bouton
        sendBtn.disabled = true;
        statusDiv.className = 'status-box';
        statusDiv.innerHTML = '⏳ Envoi en cours...';

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: message })
            });

            if (response.ok) {
                // Succès
                statusDiv.className = 'status-box success';
                statusDiv.innerHTML = '✅ Message envoyé avec succès !';
                input.value = ''; // Vide le champ
                charCount.textContent = '0'; // Remet le compteur à zéro
            } else {
                // Erreur serveur
                statusDiv.className = 'status-box error';
                statusDiv.innerHTML = '❌ Erreur : Webhook introuvable ou refusé. Vérifie l\'URL.';
            }
        } catch (error) {
            // Erreur réseau (ex: plus d'internet)
            statusDiv.className = 'status-box error';
            statusDiv.innerHTML = '🌐 Erreur réseau, vérifie ta connexion.';
            console.error(error);
        }

        // Réactiver le bouton
        sendBtn.disabled = false;
    }

    // Astuce : appuyer sur Ctrl+Entrée dans le champ envoie aussi le message
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            sendToDiscord();
        }
    });
</script>
</body>
</html>
