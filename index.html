<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Webhook Test</title>
<style>body{font-family:system-ui;background:#111827;color:#f9fafb;display:grid;place-items:center;min-height:100vh;margin:0}main{width:min(92%,520px);background:#1f2937;padding:28px;border-radius:16px}textarea{width:100%;box-sizing:border-box;min-height:130px;padding:12px;background:#111827;color:white;border:1px solid #4b5563;border-radius:10px}button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:#5865f2;color:white;font-weight:700}.note{color:#cbd5e1;font-size:.9rem}</style></head>
<body><main><h1>Webhook Test</h1><p class="note">Valeurs de test uniquement — aucun mot de passe, cookie ou token.</p>
<form id="f"><textarea id="v" maxlength="1000" placeholder="Bonjour depuis mon site !"></textarea><button>Envoyer à Discord</button></form><p id="s"></p></main>
<script>f.onsubmit=async e=>{e.preventDefault();s.textContent="Envoi…";try{let r=await fetch("/api/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({value:v.value})}),d=await r.json();if(!r.ok)throw Error(d.error);s.textContent="Envoyé ✅";v.value=""}catch(x){s.textContent="Échec : "+x.message}}</script></body></html>
